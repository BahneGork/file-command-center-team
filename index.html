function helpView(){
  const doc=h('article',{class:'manual'});doc.innerHTML=lang()==='en'?MANUAL_HTML_EN:MANUAL_HTML_DA;
  doc.querySelectorAll('a[href="#/help"]').forEach(a=>{const linkText=a.textContent.toLowerCase();const map={'status på filerne':'m-status','filvælgeren':'m-vaelger','file status':'m-status','the file picker':'m-vaelger'};const id=map[linkText];if(id) a.addEventListener('click',e=>{e.preventDefault();document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'})})});
  const go=id=>document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'});
  const toc=h('nav',{class:'toc'},h('b',{},t('manual.toc')),...[...doc.querySelectorAll('h2[id]')].map(x=>h('button',{class:'crumb',onClick:()=>go(x.id)},x.textContent)));
  return[
    h('div',{class:'top'},h('div',{},h('div',{class:'sub'},t('help.sub')),h('h1',{},t('nav.manual'))),h('div',{class:'spacer'}),h('button',{class:'btn',onClick:()=>print()},t('help.printOrSavePdf'))),
    h('div',{class:'manual-wrap'},toc,doc)
  ];
}

/* ================= Start ================= */
function showMessage(title,html){document.body.replaceChildren(h('div',{style:{maxWidth:'640px',margin:'12vh auto',padding:'0 20px',position:'relative',zIndex:1}},h('h1',{style:{font:'600 32px var(--display)'}},title),h('div',{html})))}
async function ping(){
  try{await api('/api/ping');if(!helperOnline){helperOnline=true;render()}}
  catch{if(helperOnline){helperOnline=false;render()}}
}

/* ================= Opdatering (kun desktop-appen) ================= */
function onNativeEvent(name,data){
  if(name==='update-progress'){updateProgress=data;render()}
}
async function checkForUpdate(){
  if(!native) return;
  try{const r=await api('/api/update/check');if(r.available){UPDATE=r;render()}}
  catch{}
}
async function installUpdate(){
  if(updateInstalling) return;
  updateInstalling=true;updateProgress=null;updateError='';render();
  try{await api('/api/update/install')}
  catch(e){updateInstalling=false;updateError=e.message;render();return}
  // Installeren er nu startet af Windows (med sin egen UAC-/fremgangsdialog); appen lukker snart selv
  showMessage(t('upd.installingTitle'),t('upd.installingBody'));
}
function updateBanner(){
  if(updateInstalling){
    const pct=updateProgress?updateProgress.pct:0;
    return h('div',{class:'banner upd'},
      h('div',{},t('upd.fetchingPct',UPDATE.version,pct)),
      h('div',{class:'upd-bar'},h('div',{class:'upd-fill',style:{width:pct+'%'}})),
      updateError?h('div',{class:'muted sm',style:{color:'var(--bad)'}},updateError):h('div',{class:'muted sm'},t('upd.willAskPermission')));
  }
  return h('div',{class:'banner upd'},
    h('div',{},t('upd.newVersionAvailable',UPDATE.version)),
    UPDATE.notes?h('div',{class:'muted sm',style:{margin:'4px 0',whiteSpace:'pre-wrap'}},UPDATE.notes.slice(0,300)):null,
    h('div',{class:'inl',style:{marginTop:'8px'}},
      h('button',{class:'btn sm pri',onClick:installUpdate},t('upd.installNow')),
      h('button',{class:'btn sm',onClick:()=>window.open(UPDATE.url,'_blank')},t('upd.viewChanges')),
      h('button',{class:'btn sm',onClick:()=>{UPDATE=null;render()}},t('upd.later'))));
}

async function init(){
  try{const s=await api('/api/state');if(s&&Array.isArray(s.files)) S=migrate(s);else{S=defaultState();save()}}
  catch(e){showMessage(t('init.helperNotRespondingTitle'),t('init.helperNotRespondingBody',e.message));return}
  resetUI(parseRoute());render();checkHealth();initPaneResize();
  setInterval(ping,15000);
  setInterval(()=>{if(!document.hidden) checkHealth()},5*60*1000);
  setInterval(()=>{const c=$('#clock');if(c) c.textContent=new Date().toLocaleTimeString(dateLocale(),{hour:'2-digit',minute:'2-digit'})},20000);
  if(native){setTimeout(checkForUpdate,4000);setInterval(checkForUpdate,6*60*60*1000)}
  if(!S.team.displayName) api('/api/whoami').then(r=>{if(r&&r.name){S.team.displayName=r.name;save()}}).catch(()=>{});
  if(S.team.folder) teamSync();
  setInterval(()=>{if(!document.hidden&&S.team.folder) teamSync()},30000);
}
init();
</script>
